<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ec">
  <title>留给小朋友的一角</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f4ec;
      --ink: #303b38;
      --muted: #77817a;
      --green: #43685d;
      --green-dark: #34564c;
      --line: #e8e2d7;
      --white: #fffefa;
      --peach: #f6e5d8;
      --blue: #e4edf0;
      --yellow: #f4edcf;
      --lavender: #ece7f1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 13% 8%, rgba(232, 216, 190, .33), transparent 29rem),
        radial-gradient(ellipse at 88% 24%, rgba(210, 225, 218, .3), transparent 28rem),
        var(--paper);
      font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    .page-note {
      width: min(1120px, calc(100% - 40px));
      margin: 18px auto 0;
      color: #899087;
      font-size: 12px;
      letter-spacing: .04em;
    }

    .site-header {
      width: min(1120px, calc(100% - 40px));
      height: 72px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(69, 87, 76, .1);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: .04em;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--green);
      font-size: 15px;
    }

    .header-label {
      color: var(--muted);
      font-size: 12px;
    }

    main {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 68px 0 56px;
    }

    .intro {
      max-width: 650px;
      margin: 0 auto 40px;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: clamp(32px, 4.7vw, 54px);
      font-weight: 500;
      letter-spacing: .04em;
      line-height: 1.28;
    }

    .intro-copy {
      margin: 15px 0 0;
      color: #727a72;
      font-size: 15px;
      line-height: 1.8;
    }

    .conversation-layout {
      display: grid;
      grid-template-columns: minmax(150px, 1fr) minmax(420px, 590px) minmax(150px, 1fr);
      grid-template-rows: minmax(120px, auto) minmax(120px, auto);
      align-items: center;
      gap: 18px 24px;
    }

    .quote {
      position: relative;
      width: fit-content;
      max-width: 190px;
      padding: 15px 17px 16px;
      border: 1px solid rgba(70, 82, 72, .08);
      border-radius: 3px 14px 5px 13px;
      box-shadow: 0 10px 25px rgba(61, 67, 57, .07);
      color: #4d554d;
      font-family: Georgia, "Kaiti SC", "KaiTi", serif;
      font-size: 15px;
      line-height: 1.65;
    }

    .quote::before {
      content: "“";
      position: absolute;
      top: 3px;
      left: 8px;
      color: rgba(73, 91, 79, .27);
      font-family: Georgia, serif;
      font-size: 23px;
    }

    .quote span { display: block; padding-top: 7px; }
    .quote-one { grid-column: 1; grid-row: 1; justify-self: end; transform: rotate(-4deg); background: var(--yellow); }
    .quote-two { grid-column: 3; grid-row: 1; justify-self: start; transform: rotate(3deg); background: var(--blue); }
    .quote-three { grid-column: 1; grid-row: 2; justify-self: end; transform: rotate(2.5deg); background: var(--peach); }
    .quote-four { grid-column: 3; grid-row: 2; justify-self: start; transform: rotate(-4deg); background: var(--lavender); }

    .chat-card {
      grid-column: 2;
      grid-row: 1 / 3;
      padding: 28px;
      border: 1px solid rgba(66, 83, 73, .11);
      border-radius: 22px;
      background: rgba(255, 254, 250, .91);
      box-shadow: 0 22px 65px rgba(61, 67, 57, .09);
    }

    .card-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 21px;
      color: var(--muted);
      font-size: 12px;
    }

    .status { display: inline-flex; align-items: center; gap: 7px; }
    .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #83a88e; }

    .chat-prompt {
      margin: 0 0 15px;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: .02em;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      padding: 17px 18px;
      border: 1px solid var(--line);
      border-radius: 13px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 15px;
      line-height: 1.7;
      transition: border-color .2s, box-shadow .2s;
    }

    textarea::placeholder { color: #a0a59e; }
    textarea:focus { border-color: #91aa9c; box-shadow: 0 0 0 3px rgba(67, 104, 93, .09); }

    .mood-area { margin-top: 17px; }
    .mood-label { margin: 0 0 10px; color: #747c74; font-size: 12px; }
    .moods { display: flex; flex-wrap: wrap; gap: 8px; }

    .mood {
      padding: 8px 11px;
      border: 1px solid #e7e6dc;
      border-radius: 999px;
      color: #69716a;
      background: #fff;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: .18s ease;
    }

    .mood:hover, .mood[aria-pressed="true"] {
      border-color: #8da99a;
      color: var(--green-dark);
      background: #edf3ee;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 22px;
    }

    .gentle-hint { margin: 0; color: #92978f; font-size: 11px; line-height: 1.55; }

    .send-button {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 17px;
      border: 0;
      border-radius: 11px;
      color: #fff;
      background: var(--green);
      font: inherit;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(54, 84, 74, .18);
    }

    .send-button:hover { background: var(--green-dark); }
    .send-button span { font-size: 16px; }

    .signoff {
      margin: 42px auto 0;
      color: #858b82;
      font-family: Georgia, "Kaiti SC", "KaiTi", serif;
      font-size: 14px;
      text-align: center;
      letter-spacing: .04em;
    }

    .prototype-note {
      width: min(700px, calc(100% - 40px));
      margin: 20px auto 36px;
      color: #a0a39a;
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    @media (max-width: 850px) {
      main { padding-top: 54px; }
      .conversation-layout {
        width: min(650px, 100%);
        margin: 0 auto;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: auto auto auto;
        gap: 13px 16px;
      }
      .quote { max-width: 100%; min-height: 64px; padding: 13px 15px; font-size: 14px; }
      .quote-one { grid-column: 1; grid-row: 1; justify-self: start; }
      .quote-two { grid-column: 2; grid-row: 1; justify-self: end; }
      .chat-card { grid-column: 1 / 3; grid-row: 2; }
      .quote-three { grid-column: 1; grid-row: 3; justify-self: start; }
      .quote-four { grid-column: 2; grid-row: 3; justify-self: end; }
    }

    @media (max-width: 520px) {
      .page-note, .site-header, main { width: calc(100% - 30px); }
      .page-note { margin-top: 13px; font-size: 10px; }
      .site-header { height: 59px; }
      .brand { font-size: 13px; }
      .header-label { font-size: 10px; }
      main { padding: 42px 0 35px; }
      .intro { margin-bottom: 27px; }
      .eyebrow { margin-bottom: 11px; font-size: 10px; }
      h1 { font-size: clamp(30px, 9vw, 40px); }
      .intro-copy { max-width: 320px; margin: 12px auto 0; font-size: 13px; }
      .conversation-layout { gap: 11px 12px; }
      .quote { max-width: 100%; min-height: 58px; padding: 11px 12px 10px; font-size: 12px; line-height: 1.5; }
      .quote::before { top: 1px; left: 6px; font-size: 19px; }
      .quote span { padding-top: 6px; }
      .quote-one { transform: rotate(-3deg); }
      .quote-two { transform: rotate(2deg); }
      .quote-three { transform: rotate(2deg); }
      .quote-four { transform: rotate(-3deg); }
      .chat-card { padding: 19px 16px 17px; border-radius: 18px; }
      .card-topline { margin-bottom: 17px; font-size: 10px; }
      .chat-prompt { font-size: 14px; }
      textarea { min-height: 125px; padding: 14px; font-size: 14px; }
      .mood-area { margin-top: 15px; }
      .mood { padding: 7px 9px; font-size: 11px; }
      .card-footer { align-items: flex-end; margin-top: 18px; }
      .gentle-hint { max-width: 145px; font-size: 10px; }
      .send-button { padding: 11px 13px; font-size: 12px; }
      .signoff { margin-top: 30px; font-size: 13px; }
      .prototype-note { margin-top: 14px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <p class="page-note">首屏视觉草稿 · 可以继续一起调整</p>
  <header class="site-header">
    <div class="brand"><span class="brand-mark">♥</span><span>留给小朋友的一角</span></div>
    <span class="header-label">只给你留着的小小空间</span>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">给你留的一点时间</p>
      <h1 id="page-title">想我了，就来聊几句。</h1>
      <p class="intro-copy">不管今天发生了什么，都可以慢慢跟我说。<br>我给你留了几句话，也留了声音。</p>
    </section>

    <section class="conversation-layout" aria-label="聊天输入区与留给你的话">
      <div class="quote quote-one"><span>这么搞是吧，你等着</span></div>
      <div class="quote quote-two"><span>不管什么事，靠的只能是自己</span></div>
      <div class="quote quote-three"><span>有什么事找我倾诉，我就在这听着</span></div>
      <div class="quote quote-four"><span>神了</span></div>

      <div class="chat-card">
        <div class="card-topline">
          <span>小朋友，今天想说点什么？</span>
          <span class="status">我在这儿</span>
        </div>
        <p class="chat-prompt">把想说的话写下来吧</p>
        <textarea aria-label="输入想说的话" placeholder="开心的事、烦心的事，或者只是突然想我了……"></textarea>
        <div class="mood-area">
          <p class="mood-label">拿不准怎么说？选个更接近的心情也可以。</p>
          <div class="moods" role="group" aria-label="选择心情">
            <button class="mood" type="button" aria-pressed="false">有点想你</button>
            <button class="mood" type="button" aria-pressed="false">心情低落</button>
            <button class="mood" type="button" aria-pressed="false">有点累</button>
            <button class="mood" type="button" aria-pressed="false">想分享开心</button>
          </div>
        </div>
        <div class="card-footer">
          <p class="gentle-hint">不用想好怎么说，<br>想到哪儿就说到哪儿。</p>
          <button class="send-button" type="button">说给我听 <span aria-hidden="true">↗</span></button>
        </div>
      </div>
    </section>

    <p class="signoff">今天也要好好照顾自己呀，小朋友。</p>
  </main>

  <p class="prototype-note">这是一张首屏样式草稿。心情匹配、语音回应和称呼文案，等你确认内容后再接上。</p>

  <script>
    document.querySelectorAll('.mood').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.mood').forEach((item) => item.setAttribute('aria-pressed', 'false'));
        button.setAttribute('aria-pressed', 'true');
      });
    });
  </script>
</body>
</html>
